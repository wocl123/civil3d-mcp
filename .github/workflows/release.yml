# Optional build verification. Signed binary releases are published from 배포하기.bat to the public release-only repository.
name: package-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and verify development package
        shell: powershell
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -NuGetAutodesk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
